<html>
<head>
    <title>SCBin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        /* NAV BAR */
        #nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links p {
            cursor: pointer;
            color: #cbd5e1;
            transition: 0.2s;
        }

        .nav-links p:hover {
            color: white;
        }

        /* CENTER CONTAINER */
        .container {
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        /* FORM CARD */
        form {
            background: #111827;
            padding: 25px;
            border-radius: 10px;
            width: 75%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .label {
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            color: white;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        /* BUTTON ROW */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }



        #submit-btn {
            background: #21974e;
            border-style: solid;
            border-color: #31d871;
            color: white;
            font-size: 18px;
            width: 200px;
            height: 50px;
            border-radius: 10px;
        }

        #submit-btn:hover {
            background: #0b7508;
        }

        #clear-btn {
            background: #972121;
            border-style: solid;
            border-color: #d83131;
            color: white;
            font-size: 18px;
            width: 200px;
            height: 50px;
            border-radius: 10px;
        }

        #clear-btn:hover {
            background: #694747;
        }
    </style>
</head>

<body>

    <div id="nav-bar">
        <h3 class="logo">SCBin</h3>

        <div class="nav-links">
            <p>Home</p>
            <p>Upgrades</p>
            <p>Account</p>
            <p>Random</p>
            <p>Logout</p>
        </div>
    </div>

    <div class="container">
        <form>
            <p class="label">Enter your paste</p>

            <textarea id="text-box" placeholder="Enter your paste here..."></textarea>

            <div class="btn-row">
                <button id="submit-btn" type="submit">Submit</button>
                <button id="clear-btn" type="button" onclick="clear()">Clear</button>
            </div>
        </form>
    </div>


    <script>
        const ele = document.getElementById("clear-btn");
        ele.addEventListener("click", function() {
            var tb = document.getElementById("text-box");
            tb.value = "";
        })

    </script>

</body>
</html>
